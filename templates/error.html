<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ code }} — Abroad</title>
    <link rel="icon" type="image/png" sizes="64x64" href="{{ url_for('static', filename='favicon.png') }}">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='abroad.css') }}">
</head>
<body class="auth-page">
    <div class="panel" style="max-width:520px;margin:8vh auto;text-align:center;padding:48px">
        <span class="eyebrow"><i class="fas fa-triangle-exclamation"></i> Error {{ code }}</span>
        <h1 style="font-size:28px;margin:8px 0 10px">{{ message }}</h1>
        <p style="color:var(--muted);margin-bottom:24px">Check the link or head back to your workspace.</p>
        <a class="btn btn-primary" href="{{ role_home }}"><i class="fas fa-arrow-left"></i> Back to Abroad</a>
    </div>
</body>
</html>
